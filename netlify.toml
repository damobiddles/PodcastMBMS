# Plain static site: no build step, publish the repository root.
# Netlify installs package.json dependencies for the functions in netlify/functions.
[build]
  command = "echo 'No build step'"
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Security headers for every page
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000"

# Images rarely change (replacements get a new filename), so let browsers cache them
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# Unlisted portfolio page (/damien/): keep it out of search results (shared by link only)
[[headers]]
  for = "/damien/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Free podcast check: results pages are personal, keep them out of search
[[headers]]
  for = "/podcast-check/your-check/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
